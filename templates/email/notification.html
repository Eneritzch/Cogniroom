<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="dark light">
    <meta name="supported-color-schemes" content="dark light">
    <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0e1f; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <!-- preheader (texto oculto de previsualización) -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#0a0e1f; font-size:1px; line-height:1px;">
        {% if body %}{{ body }}{% else %}{{ title }}{% endif %}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0a0e1f;">
        <tr>
            <td align="center" style="padding:32px 16px;">

                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#11162e; border:1px solid #252d56; border-radius:16px; overflow:hidden;">

                    <!-- Franja de marca (gradiente) -->
                    <tr>
                        <td bgcolor="#5dd5ff" style="height:6px; line-height:6px; font-size:6px; background-color:#5dd5ff; background-image:linear-gradient(90deg,#5dd5ff 0%,#6366f1 50%,#a78bfa 100%);">&nbsp;</td>
                    </tr>

                    <!-- Logo / marca -->
                    <tr>
                        <td style="padding:28px 32px 4px 32px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <span style="font-size:16px; font-weight:700; color:#e6e9fa; letter-spacing:-0.01em;">
                                <span style="color:#5dd5ff;">&#9679;</span>&nbsp;CogniRoom
                            </span>
                        </td>
                    </tr>

                    <!-- Título -->
                    <tr>
                        <td style="padding:10px 32px 0 32px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <h1 style="margin:0; font-size:20px; line-height:1.3; font-weight:600; color:#e6e9fa;">{{ title }}</h1>
                        </td>
                    </tr>

                    {% if body %}
                    <!-- Cuerpo -->
                    <tr>
                        <td style="padding:12px 32px 0 32px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <p style="margin:0; font-size:14px; line-height:1.6; color:#9ba4d4;">{{ body|linebreaksbr }}</p>
                        </td>
                    </tr>
                    {% endif %}

                    {% if action_url %}
                    <!-- Botón -->
                    <tr>
                        <td style="padding:24px 32px 4px 32px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td bgcolor="#5dd5ff" style="border-radius:8px;">
                                        <a href="{{ action_url }}" style="display:inline-block; padding:12px 22px; font-size:14px; font-weight:600; color:#0a0e1f; text-decoration:none; border-radius:8px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">{{ action_label }} &rarr;</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    {% endif %}

                    <!-- Pie -->
                    <tr>
                        <td style="padding:28px 32px 28px 32px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr><td style="border-top:1px solid #252d56; font-size:0; line-height:0; height:1px;">&nbsp;</td></tr>
                            </table>
                            <p style="margin:18px 0 0 0; font-size:12px; line-height:1.6; color:#6b75a8;">
                                CogniRoom &middot; Evaluaci&oacute;n cognitiva adaptativa.<br>
                                Recibe este correo por su actividad en la plataforma.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
