{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Material de origen (PDFs) procesado por la sala activa.">
    <title>PDFs · CogniRoom</title>
    {% include 'app/partials/_styles.html' %}
    <link rel="stylesheet" href="{% static 'css/app/shared/dashboard.css' %}?v={% now "U" %}">
    <link rel="stylesheet" href="{% static 'css/app/teacher/room.css' %}?v={% now "U" %}">
    <link rel="stylesheet" href="{% static 'css/app/teacher/pdfs.css' %}?v={% now "U" %}">
</head>
<body class="room-page dashboard-shell">

    {% include 'app/partials/_app-sidebar.html' with active='pdfs' %}

    <main class="dashboard-shell__main">

        {% include 'app/partials/_app-topbar.html' %}

        <span class="eyebrow">PDFs</span>
        <div class="room-head">
            <h1 class="room-title" id="room-name">—</h1>
            <div class="room-meta">
                <span><span id="room-pdfs">—</span> documentos</span>
            </div>
        </div>

        <section class="room-panel" role="region" aria-labelledby="pdfs-title">
            <header class="pdfs-toolbar">
                <h2 id="pdfs-title" class="pdfs-toolbar__title">Material de origen</h2>
                <button type="button" class="ds-btn ds-btn--ink">
                    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Subir PDF
                </button>
            </header>

            <ul class="pdfs-list" id="pdfs-list" aria-label="PDFs procesados"></ul>
        </section>
    </main>

    <div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="true"></div>

    {% include 'app/partials/_bootstrap-bundle.html' %}
    <script type="module" src="{% static 'js/app/nav-auth.js' %}?v={% now "U" %}"></script>
    <script type="module" src="{% static 'js/app/teacher/pdfs.js' %}?v={% now "U" %}"></script>
</body>
</html>
