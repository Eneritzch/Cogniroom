<header class="app-header" role="banner">
    <div class="app-header__inner">
        <a href="/app/dashboard/" class="app-header__brand">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <circle cx="16" cy="16" r="13" stroke="var(--ink)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="7"  stroke="var(--sage)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="1.8" fill="var(--terracotta)"/>
            </svg>
            CogniRoom
            <span class="app-header__version num">v0.4 — 2026.05</span>
        </a>

        <nav class="app-nav" aria-label="Principal">
            <a class="app-nav__link" href="/app/dashboard/"     data-show-for="teacher,student" {% if active == 'dashboard' %}aria-current="page"{% endif %}><span class="app-nav__link-num">01</span> Resumen</a>
            <a class="app-nav__link" href="/app/diagnoses/"     data-show-for="teacher,student" {% if active == 'diagnoses' %}aria-current="page"{% endif %}><span class="app-nav__link-num">02</span> Diagnósticos</a>
            <a class="app-nav__link" href="/app/room/"          data-show-for="teacher"         {% if active == 'room' %}aria-current="page"{% endif %}><span class="app-nav__link-num">03</span> Sala</a>
            <a class="app-nav__link" href="/app/session/"       data-show-for="student"         {% if active == 'session' %}aria-current="page"{% endif %}><span class="app-nav__link-num">04</span> Sesión</a>
            <a class="app-nav__link" href="/app/design-system/" data-show-for="public"          {% if active == 'design-system' %}aria-current="page"{% endif %}><span class="app-nav__link-num">05</span> Sistema</a>
        </nav>

        <div class="app-header__user">
            <span id="user-name" class="app-header__user-name">—</span>
            <span id="user-role" class="role-badge" data-role="">—</span>
            <button class="nav-auth-logout" id="logout-btn" type="button">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Salir
            </button>
        </div>
    </div>
</header>
