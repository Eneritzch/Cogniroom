<aside class="app-sidebar" id="app-sidebar" aria-label="Navegación principal">
    <div class="app-sidebar__top">
        <a href="/app/dashboard/" class="app-sidebar__brand">
            <span class="app-sidebar__logo">
                <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                    <circle cx="16" cy="16" r="13" stroke="var(--ink)" stroke-width="1.5"/>
                    <circle cx="16" cy="16" r="7"  stroke="var(--sage)" stroke-width="1.5"/>
                    <circle cx="16" cy="16" r="1.8" fill="var(--terracotta)"/>
                </svg>
            </span>
            <span class="app-sidebar__name">CogniRoom</span>
        </a>
        <button type="button" class="app-sidebar__toggle" id="app-sidebar-toggle" aria-label="Colapsar menú" aria-expanded="true">
            <svg class="icon-svg app-sidebar__toggle-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
    </div>

    <nav class="app-sidebar__nav" aria-label="Secciones">
        <span class="app-sidebar__section eyebrow">Menú</span>

        <a class="app-sidebar__item" href="/app/dashboard/" {% if active == 'dashboard' %}aria-current="page"{% endif %} data-tip="Dashboard">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="9" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
                <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
                <rect x="3" y="16" width="7" height="5" rx="1.5"></rect>
            </svg>
            <span class="app-sidebar__label">Dashboard</span>
        </a>
        <a class="app-sidebar__item" href="/app/room/" data-show-for="teacher" {% if active == 'room' %}aria-current="page"{% endif %} data-tip="Salas">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 21V8l9-5 9 5v13"></path>
                <path d="M9 21V12h6v9"></path>
            </svg>
            <span class="app-sidebar__label">Salas</span>
        </a>
        <a class="app-sidebar__item" href="/app/session/" data-show-for="student" {% if active == 'session' %}aria-current="page"{% endif %} data-tip="Sesión">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2v4"></path>
                <path d="M12 18v4"></path>
                <path d="m4.93 4.93 2.83 2.83"></path>
                <path d="m16.24 16.24 2.83 2.83"></path>
                <circle cx="12" cy="12" r="4"></circle>
            </svg>
            <span class="app-sidebar__label">Sesión</span>
        </a>
        <a class="app-sidebar__item" href="/app/diagnoses/" {% if active == 'diagnoses' %}aria-current="page"{% endif %} data-tip="Diagnósticos">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
            </svg>
            <span class="app-sidebar__label">Diagnósticos</span>
        </a>

        <button type="button" class="app-sidebar__item app-sidebar__item--logout" id="logout-btn" data-tip="Salir">
            <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span class="app-sidebar__label">Salir</span>
        </button>
    </nav>
</aside>
