<header class="dashboard-shell__topbar">

    <aside class="topbar-tip" id="topbar-tip" data-show-for="student" role="note" aria-live="polite" hidden>
        <span class="topbar-tip__icon" aria-hidden="true">
            <svg aria-hidden="true" class="icon-svg" width="16" height="16" viewBox="0 0 24 24">
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                <path d="M9 18h6"></path>
                <path d="M10 22h4"></path>
            </svg>
        </span>
        <span class="topbar-tip__text" id="topbar-tip-text"></span>
    </aside>

    <div class="dashboard-shell__room" data-show-for="teacher" hidden>
        <div class="dropdown">
            <button type="button" class="topbar-room" id="topbar-room-trigger" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Cambiar de sala activa">
                <span class="topbar-room__k eyebrow">Sala activa</span>
                <span class="topbar-room__v" id="topbar-room-name">—</span>
                <svg class="icon-svg topbar-room__caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <ul class="dropdown-menu topbar-room__menu" id="topbar-room-menu" aria-labelledby="topbar-room-trigger"></ul>
        </div>
    </div>

    <div class="dashboard-shell__user">
        <div class="dropdown">
            <button type="button" class="dashboard-shell__icon-btn" id="notif-trigger"
                    data-bs-toggle="dropdown" data-bs-auto-close="outside" data-bs-display="static"
                    aria-expanded="false" aria-label="Notificaciones">
                <svg class="icon-svg" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="dashboard-shell__icon-dot" id="notif-dot" aria-hidden="true" hidden></span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notif-panel" id="notif-panel" aria-labelledby="notif-trigger">
                <div class="notif-panel__head">
                    <span class="notif-panel__title">Notificaciones</span>
                    <button type="button" class="notif-panel__readall" id="notif-readall" hidden>Marcar leídas</button>
                </div>
                <ul class="notif-panel__list" id="notif-list" aria-live="polite">
                    <li class="notif-panel__empty" id="notif-empty">Sin notificaciones.</li>
                </ul>
            </div>
        </div>
        <div class="dashboard-shell__profile dropdown">
            <button type="button" class="dashboard-shell__profile-trigger" id="profile-trigger"
                    data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false" aria-label="Menú de cuenta">
                <span class="dashboard-shell__profile-avatar" aria-hidden="true" id="user-initials"></span>
                <div class="dashboard-shell__profile-meta">
                    <span class="dashboard-shell__profile-name" id="user-name"></span>
                    <span class="dashboard-shell__profile-role" id="user-role" data-role=""></span>
                </div>
                <svg class="icon-svg dashboard-shell__profile-caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <ul class="dropdown-menu dropdown-menu-end profile-menu" aria-labelledby="profile-trigger">
                <li data-show-for="teacher" hidden>
                    <a class="dropdown-item profile-menu__item" href="/app/teacher-profile/">
                        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Perfil
                    </a>
                </li>
                <li data-show-for="student" hidden>
                    <a class="dropdown-item profile-menu__item" href="/app/profile/">
                        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Perfil
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <button type="button" class="dropdown-item profile-menu__item profile-menu__logout" id="logout-btn">
                        <svg class="icon-svg" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Cerrar sesión
                    </button>
                </li>
            </ul>
        </div>
    </div>
</header>
