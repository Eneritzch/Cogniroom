<aside class="auth-instrument">
    <header class="auth-instrument__head">
        <a href="/" class="auth-instrument__brand">
            <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <circle cx="16" cy="16" r="13" stroke="var(--ink)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="7" stroke="var(--sage)" stroke-width="1.5"/>
                <circle cx="16" cy="16" r="1.8" fill="var(--terracotta)"/>
            </svg>
            CogniRoom
        </a>
    </header>

    <div class="auth-instrument__hero">
        <h1 class="auth-instrument__title">
            Un instrumento para<br>
            <span class="auth-instrument__title-muted">medir el</span>
            <span class="auth-instrument__underlined">autoconocimiento</span><br>
            <span class="auth-instrument__title-muted">de una cohorte.</span>
        </h1>
        <p class="auth-instrument__body">
            Medimos la diferencia entre lo que un estudiante cree saber y lo que
            realmente sabe.
        </p>
    </div>

    <section class="auth-instrument__center">
        <div class="calibration-ring" data-profile="overconfident" style="width:188px;height:188px;">
            <svg class="calibration-ring__svg" width="188" height="188" aria-hidden="true">
                <circle class="calibration-ring__track" cx="94" cy="94" r="87" stroke-width="13"></circle>
                <circle class="calibration-ring__fill" cx="94" cy="94" r="87" stroke-width="13"
                                stroke-dasharray="546.64" stroke-dashoffset="131.19"></circle>
            </svg>
            <div class="calibration-ring__center">
                <span class="calibration-ring__value" style="font-size:44px;">0.76</span>
                <span class="calibration-ring__label eyebrow">Autoconocimiento</span>
                <span class="calibration-ring__sublabel">Cohorte 2026·I</span>
            </div>
        </div>

        <figure class="auth-gap">
            <figcaption class="auth-gap__caption">Un caso real de la cohorte</figcaption>

            <div class="auth-gap__bars">
                <div class="auth-gap__item">
                    <div class="auth-gap__head">
                        <span class="auth-gap__name">Cree saber</span>
                        <span class="auth-gap__num">92%</span>
                    </div>
                    <div class="auth-gap__track">
                        <div class="auth-gap__fill auth-gap__fill--belief" style="--v:92%"></div>
                    </div>
                </div>

                <div class="auth-gap__item">
                    <div class="auth-gap__head">
                        <span class="auth-gap__name">Sabe realmente</span>
                        <span class="auth-gap__num">68%</span>
                    </div>
                    <div class="auth-gap__track">
                        <div class="auth-gap__fill auth-gap__fill--real" style="--v:68%"></div>
                    </div>
                </div>
            </div>

            <div class="auth-gap__delta">
                <span class="auth-gap__delta-badge">Diferencia 24%</span>
                <span class="auth-gap__delta-text">Confía de más de lo que sabe</span>
            </div>
        </figure>
    </section>
</aside>
